name: deploy

on:
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'data/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy.yml'
  # fetch ワークフローの push は GITHUB_TOKEN によるもので on: push を起動しないため、明示的に呼ばれる
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # workflow_call のときも、fetch ワークフローが push した最新の main をビルドする
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: packages/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
